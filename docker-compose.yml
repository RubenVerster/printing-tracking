name: xmas-fulfillment

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: xmas
      POSTGRES_PASSWORD: xmas
      POSTGRES_DB: xmas
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Bound to loopback only and on an out-of-the-way port: nothing else on
      # the machine or the LAN can reach it, and it cannot collide with another
      # project's Postgres. The app does not use this - it talks to db:5432 over
      # the compose network. Comment the whole mapping out if you never need
      # psql from the host; "docker compose exec db psql -U xmas -d xmas" works
      # either way.
      - "127.0.0.1:${DB_PORT:-55433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xmas -d xmas"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://xmas:xmas@db:5432/xmas
      NODE_ENV: production
    ports:
      # Host port is configurable: set APP_PORT in .env (container stays on 3000).
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
